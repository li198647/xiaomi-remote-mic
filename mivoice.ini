[general]
device_match = 2717
output_device = CABLE Input
gain = 3.0
enabled = 1
alt_key = alt
alt_mode = hold
alt_tap_ms = 60
alt_pre_ms = 150
focus_workbuddy = 0
focus_title = WorkBuddy

; ---- OK 键 -> 发送 ----
; send_keys 要和 WorkBuddy 里「发送」的快捷键完全一致
ok_to_send = 1
send_keys = ctrl+enter
; 只在这个标题的窗口前台时才转换（留空=任意窗口，容易误伤，不建议）
ok_send_title = WorkBuddy
; 遥控器最近多少毫秒内有活动，才认为这个 Enter 是遥控器按的
; 3000 = 只有「刚动过遥控器」这 3 秒内的 OK 才转发送，超时就当普通 Enter
; 调大更宽松（更容易发送），调小更保守（更不容易误发）
remote_active_ms = 3000

hotkey_quit = Ctrl+Shift+M
autostart = 0
